<svg width="1000" height="300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" viewBox="0 0 1000 300" role="img"><rect width="1000" height="300" fill="#fff"/><text x="30" y="30" font-size="16" font-weight="700" fill="#0f172a">Carte retournée, tenue par le carton</text><text x="250" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">pointes courtes en haut : on soude ici</text><rect x="90" y="130" width="320" height="14" fill="#2563eb"/><rect x="127" y="104" width="6" height="130" fill="#a16207"/><rect x="116" y="144" width="28" height="14" fill="#111827"/><rect x="367" y="104" width="6" height="130" fill="#a16207"/><rect x="356" y="144" width="28" height="14" fill="#111827"/><text x="250" y="190" text-anchor="middle" font-size="14" fill="#0f172a">partie longue piquée dans le carton</text><rect x="60" y="220" width="380" height="56" rx="4" fill="#d6b98c" stroke="#92400e" stroke-width="1.5"/><text x="250" y="254" text-anchor="middle" font-size="14" fill="#451a03">carton épais</text><text x="520" y="30" font-size="16" font-weight="700" fill="#0f172a">Le geste, en gros plan</text><text x="530" y="62" font-size="14" font-weight="700" fill="#0f172a">fer : touche la broche et le rond métallique</text><text x="960" y="88" text-anchor="end" font-size="14" font-weight="700" fill="#0f172a">étain : sur ce point, pas sur le fer</text><rect x="540" y="190" width="420" height="28" fill="#2563eb"/><rect x="690" y="184" width="100" height="6" fill="#ca8a04"/><rect x="732" y="110" width="16" height="150" fill="#ca8a04"/><rect x="706" y="218" width="68" height="34" fill="#111827"/><polygon points="540,100 572,76 734,178 724,186" fill="#64748b"/><line x1="950" y1="104" x2="754" y2="180" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/><text x="750" y="280" text-anchor="middle" font-size="14" fill="#0f172a">plastique noir à plat contre la carte</text></svg>